services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: simplechat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d simplechat"]
      interval: 5s
      timeout: 5s
      retries: 10

  simple-chat-app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/simplechat
      SPRING_DATASOURCE_USERNAME: chat
      SPRING_DATASOURCE_PASSWORD: chat
      JWT_SECRET: change-me-please-use-a-long-secret-key-32b
      JWT_EXPIRATION: 24h
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
