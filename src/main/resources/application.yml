server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: simple-chat-app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/simplechat}
    username: ${SPRING_DATASOURCE_USERNAME:chat}
    password: ${SPRING_DATASOURCE_PASSWORD:chat}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-use-a-long-secret-key-32b}
    expiration: ${JWT_EXPIRATION:24h}
